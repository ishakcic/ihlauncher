name: Build APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Ubuntu runner'da Android SDK hazır gelir. setup-android@v3 artık var olmayan 'tools' paketini
      # kurmaya çalışıp hata verdiği için kullanılmıyor; yalnızca lisanslar kabul edilir.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      # İmza anahtarı GitHub Secrets'tan gelir (depoda yok): IHL_KEYSTORE_B64, IHL_STORE_PASS, IHL_KEY_ALIAS, IHL_KEY_PASS.
      # Secret yoksa (ör. fork PR) debug imzasıyla derlenir ama YAYINLANMAZ.
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.IHL_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ihl.keystore"
            echo "IHL_KEYSTORE=$RUNNER_TEMP/ihl.keystore" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        env:
          IHL_STORE_PASS: ${{ secrets.IHL_STORE_PASS }}
          IHL_KEY_ALIAS: ${{ secrets.IHL_KEY_ALIAS }}
          IHL_KEY_PASS: ${{ secrets.IHL_KEY_PASS }}
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace --console=plain 2>&1 | tee build.log
      # Derleme patlarsa asıl hata satırlarını annotation ve özet sayfasına yaz (log açmadan görülsün)
      - name: Show build errors
        if: failure()
        run: |
          grep -E '^e: |error: |What went wrong|Execution failed|Could not |No such file|not found' build.log | head -15 | while IFS= read -r l; do echo "::error::${l:0:480}"; done || true
          { echo '### Derleme hatası (son satırlar)'; echo '```'; tail -n 70 build.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ihlauncher-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      # Ana dala her gönderimde (veya v* etiketinde) APK, GitHub Release olarak yayınlanır.
      # Launcher bu yayını kontrol edip kendini günceller. Sürüm numarası app/build.gradle.kts içindeki versionName'dir.
      - name: Read version
        id: ver
        run: |
          V=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/[^0-9.]//g')
          echo "version=$V"
          echo "v=$V" >> "$GITHUB_OUTPUT"
      - name: Prepare release asset
        run: cp app/build/outputs/apk/release/app-release.apk "ihlauncher-${{ steps.ver.outputs.v }}.apk"
      - name: Publish release
        if: github.event_name != 'pull_request' && env.IHL_KEYSTORE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.ver.outputs.v) }}
          name: ihlauncher ${{ steps.ver.outputs.v }}
          files: ihlauncher-${{ steps.ver.outputs.v }}.apk
          make_latest: true
          target_commitish: ${{ github.sha }}
