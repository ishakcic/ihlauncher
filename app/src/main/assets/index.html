<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q=s=>JSON.stringify(String(s)).replace(/"/g,'&quot;');   /* HTML attribute içine güvenli JS string */
const hexA=(h,a)=>{const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'};
const THEMES={dark:'iOS Koyu',light:'iOS Açık',midnight:'Gece Mavisi',aurora:'Aurora'};
const ACC={blue:['#0A84FF','Mavi'],green:['#30D158','Yeşil'],orange:['#FF9F0A','Turuncu'],pink:['#FF375F','Pembe'],purple:['#BF5AF2','Mor'],teal:['#40C8E0','Turkuaz']};
const SIZES={s:['Küçük',72],m:['Orta',86],l:['Büyük',104]};
const ROWS={in:'Giriş Kaynakları',wg:'Kartlar',fav:'Favoriler',apps:'Tüm Uygulamalar'},ROWI={in:'📺',wg:'🧩',fav:'⭐',apps:'🔲'};
const DEF={fav:[],hidden:[],order:[],folders:{},theme:'dark',accent:'blue',wall:'',blur:true,bootApps:[],hist:[],cecNames:{},inOrder:[],showHidden:false,keymap:{},keyNames:{},labels:{},
 rmlog:{},updRepo:'',updSkip:'',updAt:0,dbUrl:'',dbRemote:null,seen:[],newApps:{},unusedAt:0,autoBackup:{on:false,days:7,last:0},quickBar:true,colorKeys:{red:'voice',green:'notif',yellow:'search',blue:'settings'},iconSize:'m',auto:{on:false,h:12,bg:false,last:0},rows:[{id:'in',on:true},{id:'wg',on:true},{id:'fav',on:true},{id:'apps',on:true}],widgets:[{id:'w1',t:'sys'},{id:'w2',t:'storage'},{id:'w3',t:'net'}],wseq:3};

function N(m,a){return new Promise(r=>{const id='c'+(++seq);pend[id]=r;try{Native.call(id,m,JSON.stringify(a||{}))}catch(e){delete pend[id];r({error:String(e)})}})}
window.__res=(id,s)=>{const r=pend[id];delete pend[id];let o;try{o=JSON.parse(s)}catch(e){o={error:s}}if(r)r(o)};
function NS(m,a){try{return JSON.parse(Native.sync(m,JSON.stringify(a||{})))}catch(e){return {}}}
function saveNow(){clearTimeout(svT);Native.sync('setState',JSON.stringify({s:JSON.stringify(S)}))}
let svT;function save(){clearTimeout(svT);svT=setTimeout(()=>Native.sync('setState',JSON.stringify({s:JSON.stringify(S)})),250)}
function load(){const s=NS('getState');if(s&&typeof s==='object'&&!s.error)Object.assign(S,s);
 ['nightAuto','nightOn','clock','removed'].forEach(k=>delete S[k]);              /* eski sürüm alanları */
 if(!THEMES[S.theme])S.theme='dark';if(!SIZES[S.iconSize])S.iconSize='m';S.auto=Object.assign({on:false,h:12,bg:false,last:0},S.auto||{});S.colorKeys=Object.assign({},DEF.colorKeys,S.colorKeys||{});S.autoBackup=Object.assign({on:false,days:7,last:0},S.autoBackup||{});if(!Array.isArray(S.seen))S.seen=[];if(!S.newApps||typeof S.newApps!=='object')S.newApps={};if(!ACC[S.accent])S.accent='blue';
 for(const k of ['keymap','keyNames','cecNames','folders','labels','rmlog'])S[k]=S[k]||{};
 for(const k of ['fav','hidden','order','bootApps','hist','inOrder','widgets'])if(!Array.isArray(S[k]))S[k]=JSON.parse(JSON.stringify(DEF[k]));
 if(!Array.isArray(S.rows))S.rows=[];S.rows=S.rows.filter(r=>ROWS[r.id]);
 for(const r of DEF.rows)if(!S.rows.some(x=>x.id===r.id))S.rows.push({id:r.id,on:true});
 if(!S.wseq)S.wseq=S.widgets.length+3}
let tt;function toast(i,m){$('#ti').textContent=i;$('#tm').textContent=m;$('#toast').classList.add('show');clearTimeout(tt);tt=setTimeout(()=>$('#toast').classList.remove('show'),3300)}
window.__toast=toast;
/* ===== Tema ===== */
function applyTheme(){document.body.dataset.theme=S.theme;const a=ACC[S.accent][0],r=document.documentElement.style;r.setProperty('--accent',a);r.setProperty('--accent-soft',hexA(a,.22));r.setProperty('--isz',SIZES[S.iconSize][1]+'px');document.body.classList.toggle('noblur',!S.blur)}
/* ===== Saat ===== */
function tick(){const n=new Date(),t=n.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),d=n.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
 $('#clock').textContent=t;$('#date').textContent=d;setB('time',t);setB('date2',d)}
function setB(k,v){$$('[data-b="'+k+'"]').forEach(e=>e.textContent=v)}
/* ===== Odak / D-pad ===== */
const SEL='[onclick],button,input,[data-f]';
function fx(){document.querySelectorAll(SEL).forEach(e=>{if(e.tagName!=='INPUT'&&e.tagName!=='BUTTON'&&!e.hasAttribute('tabindex'))e.setAttribute('tabindex','0')})}
new MutationObserver(()=>requestAnimationFrame(fx)).observe(document.body,{childList:true,subtree:true});
let panel=null,opener=null;
function layer(){if($('#dlg').classList.contains('show'))return $('#dlg');if($('#modal').classList.contains('show'))return $('#modal');if(panel)return $('#'+panel+'Panel');return null}
function focusables(){const L=layer();let els=[...(L||document.body).querySelectorAll(SEL)];if(!L)els=els.filter(e=>!e.closest('.side,.ov2'));return els.filter(e=>!e.disabled&&e.getClientRects().length>0)}
function focusEl(e){e.focus({preventScroll:true});e.scrollIntoView({block:'center',inline:'center'})}
function focusFirst(){fx();const l=focusables();if(l.length)focusEl(l.find(e=>e.tagName!=='INPUT'&&!e.classList.contains('rt'))||l[0])}
let fkeep=null;function keepNext(){const i=focusables().indexOf(document.activeElement);fkeep=i<0?null:i}
function afterOpen(){if(fkeep!=null){fx();const l=focusables();const i=fkeep;fkeep=null;if(l[i]){focusEl(l[i]);return}}focusFirst()}
function navigate(dir){const cur=document.activeElement,l=focusables();if(!cur||!l.includes(cur)){focusFirst();return}
 const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of l){if(e===cur)continue;const b=e.getBoundingClientRect(),x=b.left+b.width/2-cx,y=b.top+b.height/2-cy;let p,s;
  if(dir==='r'){if(x<=4)continue;p=x;s=Math.abs(y)}else if(dir==='l'){if(x>=-4)continue;p=-x;s=Math.abs(y)}else if(dir==='d'){if(y<=4)continue;p=y;s=Math.abs(x)}else{if(y>=-4)continue;p=-y;s=Math.abs(x)}
  const sc=p+s*((dir==='l'||dir==='r')?3:1.5);if(sc<bs){bs=sc;best=e}}
 if(best)focusEl(best)}
let lp=false;
const CK={183:'red',403:'red',184:'green',404:'green',185:'yellow',405:'yellow',186:'blue',406:'blue'},CKN={ColorF0Red:'red',ColorF1Green:'green',ColorF2Yellow:'yellow',ColorF3Blue:'blue'};
document.addEventListener('keydown',e=>{const a=document.activeElement,inp=a&&a.tagName==='INPUT',k=e.key;
 const ck=CK[e.keyCode]||CKN[k];if(ck&&!inp){e.preventDefault();if(!e.repeat&&!layer())runAct(S.colorKeys[ck]);return}
 const D={ArrowUp:'u',ArrowDown:'d',ArrowLeft:'l',ArrowRight:'r'}[k];
 if(D){if(inp&&(D==='l'||D==='r'))return;e.preventDefault();navigate(D);return}
 if(k==='Enter'){if(inp){const f=a.dataset.submit;if(f&&window[f]){e.preventDefault();window[f]()}return}
  e.preventDefault();if(!e.repeat)lp=false;else if(!lp){lp=true;longPress(a)}return}
 if(k==='ContextMenu'&&!inp){e.preventDefault();longPress(a);return}     /* (eski sürümde keyCode 82 = 'R' harfi yazmayı engelliyordu) */
 if(k==='Escape'||(k==='Backspace'&&!inp)){e.preventDefault();window.__back()}
});
document.addEventListener('keyup',e=>{if(e.key==='Enter'){const a=document.activeElement;if(a&&a!==document.body&&a.tagName!=='INPUT'&&!lp)a.click();lp=false}});
/* dokunmatik / fare ile uzun basma */
const LPSEL='[data-p],[data-fold],[data-nk],[data-in],[data-w],[data-row],[data-addw]';
let lpT=null,lpFired=false;
document.addEventListener('touchstart',e=>{lpFired=false;clearTimeout(lpT);const t=e.target.closest(LPSEL);if(!t)return;lpT=setTimeout(()=>{lpFired=true;longPress(t)},550)},{passive:true});
['touchend','touchmove','touchcancel'].forEach(ev=>document.addEventListener(ev,()=>clearTimeout(lpT),{passive:true}));
document.addEventListener('click',e=>{if(lpFired){e.stopPropagation();e.preventDefault();lpFired=false}},true);
document.addEventListener('contextmenu',e=>{e.preventDefault();longPress(e.target)});
function longPress(a){if(!a||!a.closest)return;let t;const rid=(a.closest('.row')||{id:''}).id.slice(4);
 if(t=a.closest('[data-p]')){if(S.quickBar)quickBar(t.dataset.p,rid);else appMenu(t.dataset.p,rid);return}
 if(t=a.closest('[data-fold]')){folderMenu(t.dataset.fold);return}
 if(t=a.closest('[data-nk]')){N('notifCancel',{k:t.dataset.nk}).then(loadNotifs);return}
 if(t=a.closest('[data-in]')){inputMenu(+t.dataset.in);return}
 if(t=a.closest('[data-w]')){widgetMenu(t.dataset.w);return}
 if(t=a.closest('[data-addw]')){addWidgetMenu();return}
 if(t=a.closest('[data-row]')){rowMenu(t.dataset.row)}}
/* ===== Diyalog / modal ===== */
function showDlg(){$('#dlg').classList.add('show');setTimeout(focusFirst,30)}
function closeDlg(){$('#dlg').classList.remove('show');$('#dlgbox').style.maxWidth=''}
let menuActs=[],qActs=[];
function quickBar(p,rid){const isF=S.fav.includes(p),hid=S.hidden.includes(p),a=APPS.find(x=>x.p===p),sys=a?a.s:false;
 const it=[['▶️','Aç',()=>launch(p)],[isF?'⭐':'☆',isF?'Favoriden çıkar':'Favori',()=>toggleFav(p)],[hid?'👁️':'🙈',hid?'Göster':'Gizle',()=>toggleHide(p)],['🧊','Dondur',()=>pmDo('freeze',p)],['🗑️','Kaldır',()=>uninstallApp(p,sys)],['⋯','Daha fazla',()=>appMenu(p,rid)]];
 qActs=it.map(i=>i[2]);
 $('#dlgbox').style.maxWidth='680px';
 $('#dlgbox').innerHTML='<div class="qh"><div class="ico"><img src="'+icon(p)+'" alt=""></div><div class="qn">'+esc(lab(p))+'</div></div><div class="qb">'+it.map((i,k)=>'<div class="qa" onclick="qaPick('+k+')"><b>'+i[0]+'</b>'+i[1]+'</div>').join('')+'</div>';showDlg()}
function qaPick(k){closeDlg();qActs[k]()}
function menu(title,items){menuActs=items.map(i=>typeof i==='string'?null:i[1]);
 $('#dlgbox').innerHTML='<div class="dt">'+esc(title)+'</div>'+items.map((i,k)=>typeof i==='string'?'<div class="dsep">'+esc(i)+'</div>':'<div class="ditem" onclick="menuPick('+k+')">'+i[0]+'</div>').join('');showDlg()}
function menuPick(k){closeDlg();menuActs[k]()}
let askRes=null;
function ask(t,def){return new Promise(r=>{askRes=r;$('#dlgbox').innerHTML='<div class="dt">'+esc(t)+'</div><input id="ain" value="'+esc(def||'')+'" data-submit="askOk"><div class="drow"><div class="btn b" onclick="askDone(true)">Tamam</div><div class="btn" onclick="askDone(false)">İptal</div></div>';$('#dlg').classList.add('show');setTimeout(()=>{const i=$('#ain');i.focus();i.select()},40)})}
function askOk(){askDone(true)}
function askDone(ok){const v=$('#ain')?$('#ain').value:'';closeDlg();if(askRes)askRes(ok?v:null);askRes=null}
function conf(msg){return new Promise(r=>{askRes=r;$('#dlgbox').innerHTML='<div class="dm">'+esc(msg)+'</div><div class="drow"><div class="btn g" onclick="confDone(true)">Evet</div><div class="btn r" onclick="confDone(false)">Hayır</div></div>';showDlg()})}
function confDone(v){closeDlg();if(askRes)askRes(v);askRes=null}
function info(title,text){$('#dlgbox').innerHTML='<div class="dt">'+esc(title)+'</div><div class="dm">'+esc(text)+'</div><div class="drow"><div class="btn b" onclick="closeDlg()">Tamam</div></div>';showDlg()}
let modalBack=null;
function mset(title,html,back){if(!$('#modal').classList.contains('show'))opener=document.activeElement;modalBack=back||null;
 const nav=back?'<div class="btn" onclick="modalBackGo()">‹ Geri</div>':'<div class="btn" onclick="closeModal()">✕ Kapat</div>';
 $('#mbody').innerHTML='<div>'+nav+'</div><div class="mt">'+title+'</div><div>'+html+'</div>';$('#modal').classList.add('show');setTimeout(afterOpen,40)}
function modalBackGo(){const b=modalBack;if(b)b();else closeModal()}
function closeModal(){$('#modal').classList.remove('show');modalBack=null;curView='';$('#mbody').innerHTML='';if(opener&&opener.isConnected)try{opener.focus({preventScroll:true})}catch(e){}opener=null}
let curView='';
window.__back=function(){if($('#dlg').classList.contains('show')){closeDlg();if(askRes){askRes(null);askRes=null}return true}
 if($('#modal').classList.contains('show')){if(modalBack)modalBack();else closeModal();return true}
 if(panel){closePanels();return true}
 const c=$('#content');if($('#q').value){$('#q').value='';renderGrid();return true}
 if(c.scrollTop>10){c.scrollTo({top:0});const f=$('#favRow .card,#grid .tile');if(f)focusEl(f)}
 return true};
window.__home=function(){closeDlg();closeModal();closePanels();$('#content').scrollTo({top:0});const f=$('#favRow .card,#grid .tile');if(f)focusEl(f)};
function openPanel(n){closePanels();opener=document.activeElement;panel=n;$('#'+n+'Panel').classList.add('open');if(n==='notif')loadNotifs();else renderSettings();setTimeout(focusFirst,80)}
function closePanels(){const had=panel;$$('.side').forEach(s=>s.classList.remove('open'));panel=null;if(had&&opener&&opener.isConnected)try{opener.focus({preventScroll:true})}catch(e){}}
/* ===== Uygulamalar ===== */
let APPS=[],ALL=[],INP=[];
const baseLab=p=>(APPS.find(a=>a.p===p)||ALL.find(a=>a.p===p)||{l:p}).l;
const lab=p=>S.labels[p]||baseLab(p);
const icon=(p,b)=>'https://appicon.local/'+(b?'banner':'icon')+'/'+p;
function sortedApps(){const o=S.order||[];return [...APPS].sort((a,b)=>{const ia=o.indexOf(a.p),ib=o.indexOf(b.p);if(ia>=0&&ib>=0)return ia-ib;if(ia>=0)return -1;if(ib>=0)return 1;return lab(a.p).localeCompare(lab(b.p),'tr')})}
async function loadApps(){const r=await N('apps');APPS=Array.isArray(r)?r:[];detectNew();renderAll()}
function detectNew(){if(!APPS.length)return;if(!S.seen.length){S.seen=APPS.map(a=>a.p);save();return}
 const seen=new Set(S.seen),now=Date.now();for(const k in S.newApps)if(now-S.newApps[k]>6048e5||!APPS.some(a=>a.p===k))delete S.newApps[k];
 const fresh=APPS.filter(a=>!seen.has(a.p));if(fresh.length){fresh.forEach(a=>{S.seen.push(a.p);S.newApps[a.p]=now});toast('🆕',fresh.length===1?'Yeni uygulama: '+lab(fresh[0].p):fresh.length+' yeni uygulama eklendi')}save()}
function renderAll(){renderFavs();renderGrid();updateRowVis()}
function launch(p){if(S.newApps[p]){delete S.newApps[p];save();applyBadges()}N('launch',{p}).then(r=>{if(!r.ok)toast('❌',lab(p)+' açılamadı')})}
function tile(a){return '<div class="tile'+(S.hidden.includes(a.p)?' hid':'')+'" data-p="'+esc(a.p)+'" onclick="launch('+q(a.p)+')"><div class="iw"><div class="ico"><img src="'+icon(a.p)+'" alt=""></div></div><div class="tl2">'+esc(lab(a.p))+'</div></div>'}
function renderGrid(){const qq=($('#q').value||'').toLowerCase().trim(),inF=new Set(Object.values(S.folders).flat());let h='',list;
 const vis=a=>S.showHidden||!S.hidden.includes(a.p);
 if(qq)list=APPS.filter(a=>(lab(a.p).toLowerCase().includes(qq)||a.l.toLowerCase().includes(qq))&&vis(a));
 else{list=sortedApps().filter(a=>vis(a)&&!inF.has(a.p));
  for(const n in S.folders)h+='<div class="tile" data-fold="'+esc(n)+'" onclick="openFolder(this.dataset.fold)"><div class="fi">'+(S.folders[n].slice(0,4).map(p=>'<img src="'+icon(p)+'" alt="">').join('')||'<span class="em">📁</span>')+'</div><div class="tl2">'+esc(n)+' ('+S.folders[n].length+')</div></div>'}
 h+=list.map(tile).join('');$('#grid').innerHTML=h||'<div class="empty">Uygulama bulunamadı</div>';applyBadges()}
function searchEnter(){const qq=($('#q').value||'').toLowerCase().trim();const a=APPS.find(x=>lab(x.p).toLowerCase().includes(qq)&&(S.showHidden||!S.hidden.includes(x.p)));if(a&&qq)launch(a.p);else focusFirst()}
function renderFavs(){const f=S.fav.map(p=>APPS.find(a=>a.p===p)).filter(Boolean);
 $('#favRow').innerHTML=f.map(a=>'<div class="card fav" data-p="'+esc(a.p)+'" onclick="launch('+q(a.p)+')"><div class="th'+(a.b?'':' ic')+'" style="background-image:url('+icon(a.p,a.b)+')"></div><div class="nm">'+esc(lab(a.p))+'</div></div>').join('');applyBadges()}
function toggleFav(p){const i=S.fav.indexOf(p);if(i>=0)S.fav.splice(i,1);else S.fav.push(p);save();renderFavs();updateRowVis();toast('⭐',lab(p)+(i>=0?' favorilerden çıkarıldı':' favorilere eklendi'))}
function toggleHide(p){const i=S.hidden.indexOf(p);if(i>=0)S.hidden.splice(i,1);else S.hidden.push(p);save();renderGrid();toast('👁️',lab(p)+(i>=0?' gösterildi':' gizlendi (Launcher Ayarları’ndan geri getirilir)'))}
function toggleBoot(p){const i=S.bootApps.indexOf(p);if(i>=0)S.bootApps.splice(i,1);else S.bootApps.push(p);save();toast('🚀',lab(p)+(i>=0?': açılışta başlatma kapalı':': açılışta başlayacak'))}
async function renameApp(p){const v=await ask('Yeni ad (boş bırak = orijinal ad)',lab(p));if(v===null)return;if(v.trim()&&v.trim()!==baseLab(p))S.labels[p]=v.trim();else delete S.labels[p];save();renderAll()}
function moveApp(p,d){S.order=sortedApps().map(a=>a.p);const i=S.order.indexOf(p),j=i+d;if(i<0||j<0||j>=S.order.length)return;S.order.splice(j,0,S.order.splice(i,1)[0]);save();renderGrid();const e=$('#grid [data-p="'+p+'"]');if(e)focusEl(e)}
function appMenu(p,rid){const isF=S.fav.includes(p),hid=S.hidden.includes(p),a=APPS.find(x=>x.p===p),sys=a?a.s:false,boot=S.bootApps.includes(p);
 const it=[['▶️  Aç',()=>launch(p)],'Düzenle',
  [isF?'⭐  Favorilerden çıkar':'⭐  Favorilere ekle',()=>toggleFav(p)],
  [hid?'👁️  Göster':'🙈  Gizle',()=>toggleHide(p)],
  ['📁  Klasöre ekle / çıkar',()=>addToFolder(p)],
  ['✏️  Adı değiştir',()=>renameApp(p)],
  ['⬆️  Öne al',()=>moveApp(p,-1)],['⬇️  Geriye al',()=>moveApp(p,1)],
  [boot?'🚀  Açılışta başlatmayı kapat':'🚀  Açılışta başlat',()=>toggleBoot(p)]];
 if(rid&&ROWS[rid])it.push(['🧩  Bu bölümü taşı…',()=>rowMenu(rid)]);
 it.push('Bilgi',['ℹ️  Ayrıntılar',()=>appDetail(p)],['⚙️  Android uygulama bilgisi',()=>N('appSettings',{p})],['🔐  İzinler',()=>permsFor(p)],['🛒  Mağazada aç',()=>N('market',{p})],
  'Yönet (ADB)',['🧊  Dondur (devre dışı bırak)',()=>pmDo('freeze',p)],['⛔  Zorla durdur',()=>pmDo('stop',p)],['🔋  Arka planı kısıtla',()=>pmDo('bgRestrict',p)],['🔋  Arka plan kısıtını kaldır',()=>pmDo('bgAllow',p)],['🧹  Verileri temizle',()=>pmDo('clear',p)],['🗑️  Kaldır',()=>uninstallApp(p,sys)]);
 menu(lab(p),it)}
async function appDetail(p){const r=await N('appInfo',{p});if(r.error){toast('❌',String(r.error).slice(0,80));return}const d=t=>t?new Date(t).toLocaleDateString('tr-TR'):'-';
 info(lab(p),['Paket: '+r.p,'Sürüm: '+r.v+' ('+r.c+')','Tür: '+(r.sys?'Sistem uygulaması':'Kullanıcı uygulaması'),'Hedef SDK: '+r.sdk,'Kurulum: '+d(r.first),'Güncelleme: '+d(r.upd),'Durum: '+(r.enabled?'Aktif':'Dondurulmuş'),'APK: '+r.apk].join('\n'))}
async function uninstallApp(p,sys){if(isProt(p)){toast('⛔','Kritik paket korunuyor');return}
 const st=await N('adbStatus');
 if(!st.ready){if(sys){info('ADB gerekli','Sistem uygulamaları yalnızca ADB / Shizuku ile kaldırılabilir. Sistem Merkezi → ADB Terminal’den bağlan.');return}
  if(await conf(lab(p)+' kaldırılsın mı?'))N('uninstallUi',{p});return}

async function addToFolder(p){const names=Object.keys(S.folders);
 menu('Klasör seç',[...names.map(n=>['📁  '+n,()=>{removeFromFolders(p);S.folders[n].push(p);save();renderGrid()}]),['➕  Yeni klasör',async()=>{const n=await ask('Klasör adı','');if(n&&n.trim()){removeFromFolders(p);S.folders[n.trim()]=(S.folders[n.trim()]||[]).concat([p]);save();renderGrid()}}],['↩️  Klasörden çıkar',()=>{removeFromFolders(p);save();renderGrid()}]])}

const verNums=v=>String(v||'').replace(/^v/i,'').split(/[^0-9]+/).filter(Boolean).map(Number);
function verCmp(a,b){a=verNums(a);b=verNums(b);for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
async function updCheck(manual){if(!S.updRepo){if(manual)updView();return null}
 try{const me=await N('appInfo',{p:'com.ihlauncher.tv'});const cur=me.v||'0';
  const r=await fetch('https://api.github.com/repos/'+S.updRepo+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'}});
  if(r.status===404)throw new Error('Sürüm yayını (Release) bulunamadı');if(!r.ok)throw new Error('GitHub HTTP '+r.status);
  const j=await r.json(),tag=j.tag_name||'',ast=(j.assets||[]).find(a=>/\.apk$/i.test(a.name))||{},apk=ast.browser_download_url||'',sha=ast.digest||'';
  S.updAt=Date.now();save();const newer=verCmp(tag,cur)>0;
  if(newer&&(manual||S.updSkip!==tag)){if(manual)updShow({tag,cur,apk,sha,url:j.html_url,body:j.body||''});else toast('⬆️','Yeni sürüm var: '+tag+' • Launcher Ayarları → Güncelleme kontrolü')}
  else if(manual)toast('✅','Güncelsin ('+cur+')');
  return newer}
 catch(e){if(manual)toast('❌',String(e.message||e).slice(0,90));return null}}

 $('#dlgbox').innerHTML='<div class="dt">⬆️ Yeni sürüm: '+esc(r.tag)+'</div><div class="dm">Mevcut: '+esc(r.cur)+(body?'\n\n'+esc(body):'')+'</div><div class="drow" style="flex-wrap:wrap">'+(r.apk?'<div class="btn b" onclick="updInstall()">⬇️ İndir ve kur</div>':'')+'<div class="btn" onclick="closeDlg();N(\'openUrl\',{u:updR.url})">🌐 İndirme sayfasını aç</div>'+(r.apk?'<div class="btn" onclick="updApk()">🔗 APK adresi</div>':'')+'<div class="btn" onclick="S.updSkip=updR.tag;save();closeDlg()">Bu sürümü atla</div></div>';window.updR=r;showDlg()}

  if(!c.ok){if(await conf('Güncellemeyi kurabilmek için bu uygulamaya “Bilinmeyen uygulamaları yükle” izni vermelisin. Ayar ekranı açılsın mı?'))N('unknownSources');return}}

 toast('📦','Kurulum onayı açılıyor…')}

function sgPerf(){curView='perf';mset('⚡ Performans','<div class="nf">Animasyon ölçeği (ADB ile). Düşük değer arayüzü hızlı gösterir.</div><span class="btn" onclick="perf(\'1\')">Animasyon 1x</span><span class="btn g" onclick="perf(\'0.5\')">Animasyon 0.5x</span><span class="btn b" onclick="perf(\'0\')">Animasyon kapalı</span><div style="margin-top:12px"><span class="btn r" onclick="perf(\'kill\')">🧹 Arka plan uygulamalarını kapat</span></div>',backSG)}

async function sgRes(){curView='res';const r=await N('wmGet');
 mset('🖥️ Çözünürlük / Yoğunluk','<div class="nf">'+esc(r.code===0?r.out:'ADB bağlı değil')+'<br>Uyguladıktan sonra 15 sn içinde “Koru”yu seçmezsen otomatik eski haline döner.</div><div class="nf">Boyut:</div>'+['1280x720','1920x1080','2560x1440','3840x2160'].map(s=>'<span class="btn" onclick="wmApply(\'wm size '+s+'\')">'+s+'</span>').join('')+'<div class="nf">Yoğunluk (dpi):</div>'+[160,213,240,320,480].map(d=>'<span class="btn" onclick="wmApply(\'wm density '+d+'\')">'+d+'</span>').join('')+'<div style="margin-top:12px"><span class="btn r" onclick="wmReset()">↩️ Sıfırla</span></div>',backSG)}
let wmI;
async function wmApply(c){const r=await N('wmSet',{c});if(r.code!==0){toast('❌',String(r.out||r.error||'ADB bağlı değil').slice(0,90));return}
 let t=15;$('#dlgbox').innerHTML='<div class="dm">Ekran düzgün görünüyor mu?\n<b id="wmt">15</b> sn içinde Koru seçilmezse eski haline döner.</div><div class="drow"><div class="btn g" onclick="wmKeep()">Koru</div><div class="btn r" onclick="wmReset()">Geri al</div></div>';showDlg();clearInterval(wmI);wmI=setInterval(()=>{t--;const e=$('#wmt');if(e)e.textContent=t;if(t<=0){clearInterval(wmI);closeDlg()}},1000)}
async function wmKeep(){clearInterval(wmI);await N('wmConfirm');closeDlg();toast('✅','Ayar korundu');sgRes()}
async function wmReset(){clearInterval(wmI);await N('wmReset');closeDlg();toast('↩️','Sıfırlandı');sgRes()}
/* ===== Kumanda renkli tuşları ===== */
const ACTS={none:['🚫','Yok'],voice:['🎤','Sesli arama'],search:['🔍','Uygulama ara'],notif:['🔔','Bildirimler'],settings:['⚙️','Ayarlar'],center:['🛠️','Sistem Merkezi'],layout:['🧩','Ana ekran düzeni'],android:['📱','Android Ayarları'],top:['⬆️','Başa dön'],inputs:['📺','Giriş kaynağı seç'],clean:['🧹','Önbelleği temizle'],backup:['💾','Şimdi yedekle']};
function runAct(a){switch(a){
 case 'voice':voice();break;
 case 'search':closePanels();$('#content').scrollTo({top:0});$('#q').focus();break;
 case 'notif':openPanel('notif');break;case 'settings':openPanel('settings');break;
 case 'center':surgeonHome();break;case 'layout':layoutView();break;case 'android':N('openSettings',{k:'android'});break;
 case 'top':closePanels();$('#content').scrollTo({top:0});{const f=$('#favRow .card,#grid .tile');if(f)focusEl(f)}break;
 case 'inputs':menu('Giriş kaynağı',INPS.length?INPS.map((i,k)=>['📺  '+(S.cecNames[i.id]||i.cec||i.label),()=>goInput(k)]):[['Bu cihazda giriş yok',()=>{}]]);break;
 case 'clean':autoCleanRun(true);break;case 'backup':backupNow(true);break}}
const CKC={red:['#FF453A','Kırmızı'],green:['#30D158','Yeşil'],yellow:['#FFD60A','Sarı'],blue:['#0A84FF','Mavi']};
function sgColor(){curView='color';mset('🎮 Kumanda Kısayolları','<div class="nf">Kumandanın renkli tuşlarına ana ekranda bir eylem ata. (Renkli tuşu olmayan kumandalarda çalışmaz.)</div>'+
 Object.keys(CKC).map(k=>'<div class="r2" onclick="colorPick(\''+k+'\')"><div class="n"><span class="cd" style="background:'+CKC[k][0]+'"></span>'+CKC[k][1]+' tuş</div><span class="btn">'+ACTS[S.colorKeys[k]||'none'][0]+' '+ACTS[S.colorKeys[k]||'none'][1]+'</span></div>').join(''),launcherSettings)}
function colorPick(k){menu(CKC[k][1]+' tuş',Object.keys(ACTS).map(a=>[ACTS[a][0]+'  '+ACTS[a][1],()=>{S.colorKeys[k]=a;save();keepNext();sgColor()}]))}
/* ===== Ses komutu ===== */
function voice(){N('voice').then(r=>{if(r.error)toast('❌',r.error)})}
let vActs=[];
window.__voice=t=>{t=(t||'').toLowerCase().trim();if(!t){toast('🎤','Anlaşılamadı');return}voiceResults(t)};
function voiceResults(t){const qq=t.replace(/(^|\s)(aç|çalıştır|başlat|git|göster)(?=\s|$)/g,' ').replace(/\s+/g,' ').trim(),words=qq.split(' ').filter(w=>w.length>1),res=[];
 const apps=APPS.filter(a=>S.showHidden||!S.hidden.includes(a.p)).map(a=>{const l=lab(a.p).toLowerCase(),b=a.l.toLowerCase();let sc=0;if(qq&&(qq===l||qq.indexOf(l)>=0))sc+=10;if(qq&&l.startsWith(qq))sc+=5;words.forEach(w=>{if(l.includes(w)||b.includes(w))sc+=3});return{a,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc||lab(x.a.p).localeCompare(lab(y.a.p),'tr')).slice(0,8);
 apps.forEach(x=>res.push({img:icon(x.a.p),t:lab(x.a.p),d:'Uygulamayı aç',f:()=>launch(x.a.p)}));
 const cmds=[['ayarlar','⚙️','Ayarlar',()=>openPanel('settings')],['bildirim','🔔','Bildirimler',()=>openPanel('notif')],['sistem','🛠️','Sistem Merkezi',surgeonHome],['debloat','🧼','Akıllı Debloat',sgDebloat],['telemetri','🛡️','Telemetri & Gizlilik',sgTele],['temizle','🧹','Önbelleği temizle',()=>autoCleanRun(true)],['tema','🎨','Tema & Görünüm',openTheme],['duvar','🖼️','Duvar Kağıdı',openWall],['kart','🧩','Kart ekle',addWidgetMenu],['widget','🧩','Kart ekle',addWidgetMenu]];
 cmds.forEach(c=>{if(t.indexOf(c[0])>=0||words.some(w=>w.length>3&&c[0].startsWith(w)))if(!res.some(r=>r.t===c[2]))res.push({e:c[1],t:c[2],d:'Ayar / araç',f:c[3]})});
 INPS.forEach((i,k)=>{const n=(S.cecNames[i.id]||i.cec||i.label).toLowerCase();if(words.some(w=>n.includes(w)||i.label.toLowerCase().includes(w)))res.push({e:'📺',t:'Giriş: '+(S.cecNames[i.id]||i.cec||i.label),d:'Bu girişe geç',f:()=>goInput(k)})});
 res.push({e:'🔍',t:'Tüm uygulamalarda ara: “'+qq+'”',d:'Ana ekrandaki aramaya yaz',f:()=>{$('#q').value=qq;renderGrid();$('#content').scrollTo({top:0})}});
 vActs=res.map(r=>r.f);
 $('#dlgbox').style.maxWidth='620px';
 $('#dlgbox').innerHTML='<div class="dt">🎤 “'+esc(t)+'”</div><div class="dm" style="text-align:center">'+(apps.length?apps.length+' uygulama bulundu':'Eşleşen uygulama yok')+'</div>'+res.map((r,k)=>'<div class="ditem vr" onclick="voicePick('+k+')">'+(r.img?'<img src="'+r.img+'" alt="">':'<div class="vi">'+r.e+'</div>')+'<div><div>'+esc(r.t)+'</div><div style="font-size:12px;opacity:.7;font-weight:400">'+esc(r.d)+'</div></div></div>').join('');showDlg()}
function voicePick(k){closeDlg();vActs[k]()}

 N('setKeymap',{m:JSON.stringify(S.keymap||{})});
 loadApps().then(()=>{loadInputs();setTimeout(()=>{if(document.activeElement===document.body||!document.activeElement){const f=$('#favRow .card,#grid .tile');if(f)focusEl(f)}},250)});
 setInterval(poll,3000);setTimeout(unusedHint,20000);setTimeout(()=>{if(S.updRepo&&Date.now()-S.updAt>6048e5)updCheck(false)},40000);setTimeout(()=>{if(S.dbUrl&&Date.now()-((S.dbRemote||{}).t||0)>6048e5)dbUpdate(false)},30000);setInterval(pollN,8000);setInterval(autoCheck,600000);setInterval(()=>S.widgets.filter(w=>w.t==='weather').forEach(loadWx),900000);poll();pollN()}
init();
