const verNums=v=>String(v||'').replace(/^v/i,'').split(/[^0-9]+/).filter(Boolean).map(Number);
function verCmp(a,b){a=verNums(a);b=verNums(b);for(let i=0;i<Math.max(a.length,b.length);i++){const x=a[i]||0,y=b[i]||0;if(x!==y)return x>y?1:-1}return 0}
async function updCheck(manual){if(!S.updRepo){if(manual)updView();return null}
 try{const me=await N('appInfo',{p:'com.ihlauncher.tv'});const cur=me.v||'0';
  const r=await fetch('https://api.github.com/repos/'+S.updRepo+'/releases/latest',{headers:{'Accept':'application/vnd.github+json'}});
  if(r.status===404)throw new Error('Sürüm yayını (Release) bulunamadı');if(!r.ok)throw new Error('GitHub HTTP '+r.status);
  const j=await r.json(),tag=j.tag_name||'',ast=(j.assets||[]).find(a=>/\.apk$/i.test(a.name))||{},apk=ast.browser_download_url||'',sha=ast.digest||'';
  S.updAt=Date.now();save();const newer=verCmp(tag,cur)>0;
  if(newer&&(manual||S.updSkip!==tag)){if(manual)updShow({tag,cur,apk,sha,url:j.html_url,body:j.body||''});else toast('⬆️','Yeni sürüm var: '+tag+' • Launcher Ayarları → Güncelleme kontrolü')}
  else if(manual)toast('✅','Güncelsin ('+cur+')');
  return newer}

 mset('HDMI-CEC / Girişler','<div class="nf">Geç: girişe geç (CEC cihazı çoğu zaman uyanır) • Adı değiştir: kendi etiketin.</div>'+(INPS.length?INPS.map((i,k)=>'<div class="r2"><div><div class="n">'+esc(S.cecNames[i.id]||i.cec||i.label)+'</div><div class="p">'+esc(i.label)+' • port '+i.port+' • CEC: '+esc(i.cec||'-')+' • '+['bağlı','beklemede','bağlı değil'][i.state]+'</div></div><div><span class="btn g" onclick="goInput('+k+')">Geç</span><span class="btn" onclick="renameInput('+k+').then(sgCec)">Adı değiştir</span></div></div>').join(''):'<div class="empty">Bu cihazda TV girişi bulunamadı</div>')+

 '<div class="nf">Not: Android, tek bir HDMI cihazına doğrudan “aç/kapat” komutu göndermeyi kabuktan sunmuyor. Girişe geçmek (yönlendirme) cihazı uyandırır; kapatma ise TV uyurken toplu gider.</div>',backSG)}

function sgBoot(){curView='boot';mset('Açılışta Başlat','<div class="nf">Cihaz her yeniden başladığında launcher ilk açılışında bu uygulamalar sırayla başlatılır.</div>'+sortedApps().map((a,k)=>'<div class="r2" onclick="bootTog('+k+')"><div class="n">'+esc(lab(a.p))+'</div>'+tg(S.bootApps.includes(a.p))+'</div>').join(''),backSG)}
function bootTog(k){const p=sortedApps()[k].p,i=S.bootApps.indexOf(p);if(i>=0)S.bootApps.splice(i,1);else S.bootApps.push(p);save();const e=$$('#mbody .r2')[k];if(e)e.querySelector('.tog').classList.toggle('on',i<0)}

async function sgBackup(){curView='backup';const bi=await N('backupInfo'),ab=S.autoBackup;if(curView!=='backup')return;
 mset('Yedekle / Geri Yükle','<div class="nf">Tema, favoriler, gizli uygulamalar, klasörler, sıralama, kartlar, bölüm düzeni, kumanda atamaları ve ayarlar JSON olarak yedeklenir.</div>'+
 '<div class="sec">Tek tuşla yedek</div>'+
 '<div class="r2" onclick="N(\'backupTree\')"><div><div class="n">Yedek klasörü</div><div class="s2">'+(bi.set?esc(bi.label||'seçili'):'Seçilmedi — USB belleği tak ve bir klasör seç (ilk seferde bir kez)')+'</div></div><span class="btn">'+(bi.set?'Değiştir':'Seç')+'</span></div>'+
 '<div><span class="btn b" onclick="backupNow(true)">Şimdi yedekle</span></div>'+
 '<div class="r2" onclick="abSet(\'on\')"><div><div class="n">Otomatik yedek</div><div class="s2">Seçili klasöre belirli aralıkta yedek alır (USB takılıysa). Son: '+(ab.last?new Date(ab.last).toLocaleString('tr-TR'):'yok')+'</div></div>'+tg(ab.on)+'</div>'+
 '<div class="chips">'+[3,7,14,30].map(d=>'<div class="chip'+(ab.days===d?' on':'')+'" onclick="abSet(\'days\','+d+')">'+d+' gün</div>').join('')+'</div>'+
 '<div class="sec">Dosya olarak</div><div class="nf">Sistem dosya seçicisiyle istediğin yere kaydet veya oradan geri yükle (USB; cihazında Google Drive uygulaması varsa Drive da listelenir).</div><span class="btn" onclick="saveNow();N(\'exportBackup\')">Dosya olarak kaydet</span><span class="btn" onclick="N(\'importBackup\')">İçe aktar</span>',backSG)}
function abSet(k,v){const a=S.autoBackup;if(k==='on'){a.on=!a.on;if(a.on&&!a.last)a.last=0}else a.days=v;save();keepNext();sgBackup()}
window.__backupTree=()=>{toast('📁','Yedek klasörü seçildi');if(curView==='backup')sgBackup()};

 mset('İzinler — '+esc(lab(p)),'<div class="nf">Yalnızca çalışma zamanı (tehlikeli) izinler listelenir. Aç/kapat: ADB ile ver/geri al.</div>'+(r.length?r.map((x,k)=>'<div class="r2" onclick="permTog('+k+')"><div><div class="n">'+esc(x.n.replace('android.permission.',''))+'</div><div class="p">'+esc(x.n)+'</div></div>'+tg(x.g)+'</div>').join(''):'<div class="empty">Çalışma zamanı izni yok</div>'),backSG)}

 mset('Çözünürlük / Yoğunluk','<div class="nf">'+esc(r.code===0?r.out:'ADB bağlı değil')+'</div><div class="nf">Bir ayarı uyguladıktan sonra ekranda <b>Koru / Geri al</b> penceresi açılır. Koru’yu seçersen ayar kalıcı olur; seçmezsen süre dolunca önceki ayara dönülür.</div>'+

  '<div class="sec">Boyut</div>'+['1280x720','1920x1080','2560x1440','3840x2160'].map(s=>'<span class="btn" onclick="wmApply(\'wm size '+s+'\')">'+s+'</span>').join('')+
  '<div class="sec">Yoğunluk (dpi)</div>'+[160,213,240,320,480].map(d=>'<span class="btn" onclick="wmApply(\'wm density '+d+'\')">'+d+'</span>').join('')+

/* ===== Kumanda renkli tuşları ===== */
const ACTS={none:['','Yok'],voice:['','Sesli arama'],search:['','Uygulama ara'],notif:['','Bildirimler'],settings:['','Ayarlar'],center:['','Sistem Merkezi'],layout:['','Ana ekran düzeni'],android:['','Android Ayarları'],top:['','Başa dön'],inputs:['','Giriş kaynağı seç'],clean:['','Önbelleği temizle'],backup:['','Şimdi yedekle']};
function runAct(a){switch(a){
 case 'voice':voice();break;
 case 'search':closePanels();$('#content').scrollTo({top:0});actInput($('#q'));break;
 case 'notif':openPanel('notif');break;case 'settings':openPanel('settings');break;
 case 'center':surgeonHome();break;case 'layout':layoutView();break;case 'android':N('openSettings',{k:'android'});break;
 case 'top':closePanels();$('#content').scrollTo({top:0});{const f=$('#favRow .card,#grid .tile');if(f)focusEl(f)}break;
 case 'inputs':menu('Giriş kaynağı',INPS.length?INPS.map((i,k)=>[''+(S.cecNames[i.id]||i.cec||i.label),()=>goInput(k)]):[['Bu cihazda giriş yok',()=>{}]]);break;
 case 'clean':autoCleanRun(true);break;case 'backup':backupNow(true);break}}
const CKC={red:['#FF453A','Kırmızı'],green:['#30D158','Yeşil'],yellow:['#FFD60A','Sarı'],blue:['#0A84FF','Mavi']};
function sgColor(){curView='color';mset('Kumanda Kısayolları','<div class="nf">Kumandanın renkli tuşlarına ana ekranda bir eylem ata. (Renkli tuşu olmayan kumandalarda çalışmaz.)</div>'+
 Object.keys(CKC).map(k=>'<div class="r2" onclick="colorPick(\''+k+'\')"><div class="n"><span class="cd" style="background:'+CKC[k][0]+'"></span>'+CKC[k][1]+' tuş</div><span class="btn">'+ACTS[S.colorKeys[k]||'none'][0]+' '+ACTS[S.colorKeys[k]||'none'][1]+'</span></div>').join(''),launcherSettings)}
function colorPick(k){menu(CKC[k][1]+' tuş',Object.keys(ACTS).map(a=>[ACTS[a][0]+'  '+ACTS[a][1],()=>{S.colorKeys[k]=a;save();keepNext();sgColor()}]))}
/* ===== Ses komutu ===== */
function voice(){N('voice').then(r=>{if(r.error)toast('❌',r.error)})}
let vActs=[];
window.__voice=t=>{t=(t||'').toLowerCase().trim();if(!t){toast('🎤','Anlaşılamadı');return}voiceResults(t)};
function voiceResults(t){const qq=t.replace(/(^|\s)(aç|çalıştır|başlat|git|göster)(?=\s|$)/g,' ').replace(/\s+/g,' ').trim(),words=qq.split(' ').filter(w=>w.length>1),res=[];
 const apps=APPS.filter(a=>S.showHidden||!S.hidden.includes(a.p)).map(a=>{const l=lab(a.p).toLowerCase(),b=a.l.toLowerCase();let sc=0;if(qq&&(qq===l||qq.indexOf(l)>=0))sc+=10;if(qq&&l.startsWith(qq))sc+=5;words.forEach(w=>{if(l.includes(w)||b.includes(w))sc+=3});return{a,sc}}).filter(x=>x.sc>0).sort((x,y)=>y.sc-x.sc||lab(x.a.p).localeCompare(lab(y.a.p),'tr')).slice(0,8);
 apps.forEach(x=>res.push({img:icon(x.a.p),t:lab(x.a.p),d:'Uygulamayı aç',f:()=>launch(x.a.p)}));
 const cmds=[['ayarlar','','Ayarlar',()=>openPanel('settings')],['bildirim','','Bildirimler',()=>openPanel('notif')],['sistem','','Sistem Merkezi',surgeonHome],['debloat','','Akıllı Debloat',sgDebloat],['telemetri','','Telemetri & Gizlilik',sgTele],['temizle','','Önbelleği temizle',()=>autoCleanRun(true)],['tema','','Tema & Görünüm',openTheme],['duvar','','Duvar Kağıdı',openWall],['kart','','Kart ekle',addWidgetMenu],['widget','','Kart ekle',addWidgetMenu]];
 cmds.forEach(c=>{if(t.indexOf(c[0])>=0||words.some(w=>w.length>3&&c[0].startsWith(w)))if(!res.some(r=>r.t===c[2]))res.push({e:c[1],t:c[2],d:'Ayar / araç',f:c[3]})});
 INPS.forEach((i,k)=>{const n=(S.cecNames[i.id]||i.cec||i.label).toLowerCase();if(words.some(w=>n.includes(w)||i.label.toLowerCase().includes(w)))res.push({e:'',t:'Giriş: '+(S.cecNames[i.id]||i.cec||i.label),d:'Bu girişe geç',f:()=>goInput(k)})});
 res.push({e:'',t:'Tüm uygulamalarda ara: “'+qq+'”',d:'Ana ekrandaki aramaya yaz',f:()=>{$('#q').value=qq;renderGrid();$('#content').scrollTo({top:0})}});
 vActs=res.map(r=>r.f);
 $('#dlgbox').style.maxWidth='620px';
 $('#dlgbox').innerHTML='<div class="dt">“'+esc(t)+'”</div><div class="dm" style="text-align:center">'+(apps.length?apps.length+' uygulama bulundu':'Eşleşen uygulama yok')+'</div>'+res.map((r,k)=>'<div class="ditem vr" onclick="voicePick('+k+')">'+(r.img?'<img src="'+r.img+'" alt="">':'<div class="vi">'+r.e+'</div>')+'<div><div>'+esc(r.t)+'</div><div style="font-size:12px;opacity:.7;font-weight:400">'+esc(r.d)+'</div></div></div>').join('');showDlg()}
function voicePick(k){closeDlg();vActs[k]()}

 if(!S.hintLp&&navigator.maxTouchPoints===0){S.hintLp=1;save();setTimeout(()=>toast('','Seçenekler için OK tuşunu basılı tut'),2500)}
 setInterval(poll,3000);setTimeout(unusedHint,20000);setTimeout(()=>{if(S.updRepo&&Date.now()-S.updAt>6048e5)updCheck(false)},40000);setTimeout(()=>{if(S.dbUrl&&Date.now()-((S.dbRemote||{}).t||0)>6048e5)dbUpdate(false)},30000);setInterval(pollN,8000);setInterval(autoCheck,600000);setInterval(()=>S.widgets.filter(w=>w.t==='weather').forEach(loadWx),900000);poll();pollN()}
